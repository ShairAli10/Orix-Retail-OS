name: Desktop quality
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-counter:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit all dependencies including shipped Electron
        run: pnpm audit:security
      - run: pnpm check
      - run: pnpm test:e2e
      - name: Build Windows installer
        run: pnpm dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify packaged Windows SQLite startup
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "release/windows/win-unpacked/Orix Retail OS.exe" -ArgumentList "--smoke" -PassThru
          if (-not $app.WaitForExit(30000)) {
            $app.Kill()
            throw "Packaged application did not finish its startup check."
          }
          if ($app.ExitCode -ne 0) { throw "Packaged startup failed: $($app.ExitCode)" }
      - name: Record installer identity
        shell: pwsh
        run: |
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "release/windows/Orix-Retail-OS-Setup-$version-x64.exe" -ErrorAction Stop
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content release/windows/SHA256SUMS.txt -Encoding utf8
          @{
            version = $version
            commit = $env:GITHUB_SHA
            workflowRun = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            installer = $installer.Name
            sha256 = $hash
            platform = "win32"
            architecture = "x64"
            signed = $false
            targetMachineAccepted = $false
          } | ConvertTo-Json | Set-Content release/windows/build-record.json -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-check-evidence
          path: test-results/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: windows-installer-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            release/windows/Orix-Retail-OS-Setup-*.exe
            release/windows/SHA256SUMS.txt
            release/windows/build-record.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: windows-support-and-symbols-${{ github.sha }}
          retention-days: 90
          if-no-files-found: error
          path: |
            release/windows/win-unpacked/
            release/windows/build-record.json
            pnpm-lock.yaml
            packages/database/src/migrations/
            apps/desktop/dist/main/
            apps/desktop/dist/renderer/
            apps/desktop/preload.cjs
            apps/desktop/package.json
